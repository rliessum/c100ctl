[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c100ctl"
version = "1.5.0"
description = "Linux and macOS host for the Keychron C100 8K macropad: bindings, per-key RGB, Mix RGB, and Advanced settings"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Richard van Liessum", email = "richard@liessum.net" },
]
requires-python = ">=3.11"
keywords = ["keychron", "c100", "qmk", "via", "macropad", "linux", "macos", "omarchy", "hyprland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/rliessum/c100ctl"
Issues = "https://github.com/rliessum/c100ctl/issues"
Source = "https://github.com/rliessum/c100ctl"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
c100ctl = "c100ctl.__main__:main"

[tool.coverage.run]
branch = true
source = ["c100ctl"]
omit = [
    "c100ctl/gui.py",
    "c100ctl/__main__.py",
    "c100ctl/__init__.py",
    # Linux-only modules: exercised by tests/test_pad.py and tests/test_uinput.py
    # when python-evdev is installed (CI). They sit at 0% on macOS.
    "c100ctl/pad.py",
    "c100ctl/uinput_kb.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.setuptools.packages.find]
include = ["c100ctl*"]
exclude = ["c100ctl.tests*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # GTK constructors in defaults are idiomatic here
    "SIM105",  # contextlib.suppress is not clearer for these OSError guards
    "RUF001",  # · — × in UI strings and comments are deliberate
    "RUF003",
    "RUF046",  # int(round(...)) documents the intent at the HSV boundaries
    "SIM108",  # an if/else block often reads better than a ternary here
    "C408",    # dict(a=1) is clearer than a literal when faking kwargs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B017", "RUF059", "SIM117"]  # test-style nits
"c100ctl/gui.py" = ["E402", "I001"]  # Homebrew env, then gi.require_version, then gi.repository

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "c100ctl.gui"
ignore_errors = true
