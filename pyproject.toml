[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c100ctl"
version = "1.2.0"
description = "Linux controller for the Keychron C100 8K macropad"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Richard van Liessum", email = "richard@liessum.net" },
]
requires-python = ">=3.11"
keywords = ["keychron", "c100", "qmk", "via", "macropad", "linux", "omarchy", "hyprland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/rliessum/c100ctl"
Issues = "https://github.com/rliessum/c100ctl/issues"
Source = "https://github.com/rliessum/c100ctl"

[project.scripts]
c100ctl = "c100ctl.__main__:main"

[tool.setuptools.packages.find]
include = ["c100ctl*"]
